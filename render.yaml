services:
  - type: web
    name: notify-me
    env: docker
    plan: free
    healthCheckPath: /
    autoDeploy: false
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PRISMA_CLIENT_ENGINE_TYPE
        value: binary
      - key: SCOPES
        value: read_products,read_inventory,write_products
      - key: PORT
        value: 10000

  - type: pserv
    name: notify-me-db
    plan: free
    env: postgres
